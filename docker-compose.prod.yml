services:
  # -----------------------------------------------------------------------
  # PostgreSQL 16 database (Internal Network Only)
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusconnect}
      POSTGRES_USER: ${POSTGRES_USER:-campusconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # No host port exposed — accessed only via internal bridge network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusconnect} -d ${POSTGRES_DB:-campusconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - campusconnect-prod-net

  # -----------------------------------------------------------------------
  # FastAPI backend (Internal Network Only, non-root user)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend-prod
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campusconnect}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-campusconnect}
      ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-college.edu}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@campusconnect.edu}
      UPLOAD_BASE_DIR: /app/uploads
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      COOKIE_PATH: /api/v1/auth
      CORS_ALLOWED_ORIGINS: '["https://${PRODUCTION_DOMAIN:-localhost}"]'
      HALL_BOOKING_MIN_ADVANCE_DAYS: 7
      CURRENT_ACADEMIC_YEAR: 2026-27
    volumes:
      - uploads_prod_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - campusconnect-prod-net

  # -----------------------------------------------------------------------
  # React frontend (Served statically via production Nginx)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campusconnect-frontend-prod
    restart: always
    depends_on:
      - backend
    networks:
      - campusconnect-prod-net

  # -----------------------------------------------------------------------
  # Edge Gateway Reverse Proxy (Nginx) — Only ports 80/443 exposed
  # -----------------------------------------------------------------------
  gateway:
    image: nginx:1.27-alpine
    container_name: campusconnect-gateway-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/certs:/etc/nginx/certs:ro
    depends_on:
      - backend
      - frontend
    networks:
      - campusconnect-prod-net

volumes:
  postgres_prod_data:
    driver: local
  uploads_prod_data:
    driver: local

networks:
  campusconnect-prod-net:
    driver: bridge
