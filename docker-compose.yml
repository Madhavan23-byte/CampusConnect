services:
  # -----------------------------------------------------------------------
  # PostgreSQL 16 database
  # -----------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: campusconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campusconnect}
      POSTGRES_USER: ${POSTGRES_USER:-campusconnect}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusconnect_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusconnect} -d ${POSTGRES_DB:-campusconnect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - campusconnect-network

  # -----------------------------------------------------------------------
  # FastAPI backend
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campusconnect-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campusconnect}:${POSTGRES_PASSWORD:-campusconnect_dev_password}@postgres:5432/${POSTGRES_DB:-campusconnect}
      ENV: ${ENV:-development}
      DEBUG: ${DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-college.edu}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-development}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@campusconnect.local}
      UPLOAD_BASE_DIR: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-["http://localhost:5173","http://localhost:3000"]}
      HALL_BOOKING_MIN_ADVANCE_DAYS: ${HALL_BOOKING_MIN_ADVANCE_DAYS:-7}
      CURRENT_ACADEMIC_YEAR: ${CURRENT_ACADEMIC_YEAR:-2026-27}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - campusconnect-network

  # -----------------------------------------------------------------------
  # React frontend (development mode with HMR)
  # For production, frontend is built and served by Nginx
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: campusconnect-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume to prevent host node_modules override
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    networks:
      - campusconnect-network

volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  campusconnect-network:
    driver: bridge
